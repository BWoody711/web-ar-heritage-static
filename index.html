<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local History AR</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script
      type="text/javascript"
      src="https://raw.githack.com/AR-js-org/AR.js/master/three.js/build/ar-threex-location-only.js"
    ></script>
    <script
      type="text/javascript"
      src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"
    ></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
      #debugMenu {
        display: none;
        position: fixed;
        top: 2vh;
        right: 2vh;
        width: 30%;
        height: 20vh;
        grid-template-columns: auto;
        grid-template-rows: auto auto auto auto auto auto auto;
        z-index: 6;
        background-color: white;
        padding: 2px;
      }
      video {
        padding: 0;
        margin: 0;
        width: 180vw;
        height: 90vh;
        position: fixed;
        top: 0;
        z-index: 2;
        left: -40vw;
      }
      body {
        margin: 0;
        padding: 0;
      }
      .thumbMenu {
        position: fixed;
        bottom: 0;
        height: 8vh;
        width: 100%;
        display: grid;
        grid-template-columns: auto auto auto;
        z-index: 5;
      }
      .thumbButton {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        z-index: 5;
        background-color: white;
        border: 1px solid black;
      }
      #desc-button {
        background-color: white;
      }
      a-scene {
        z-index: 3;
      }
      #description {
        position: absolute;
        bottom: 8vh;
        height: 30vh;
        width: 88%;
        margin: 3%;
        display: none;
        grid-template-columns: auto;
        grid-template-rows: 15% auto 25%;
        z-index: 4;
        background-color: white;
        padding: 3%;
      }
      .description-box {
        display: "flex";
        overflow-y: scroll;
      }
      #building-name {
        margin: 0px;
        padding: 0px;
      }
      h5 {
        margin: 0px;
        padding: 0px;
      }
      #arch-description {
        display: none;
      }
      #story-description {
        display: none;
      }
      .audio-grid {
        display: grid;
        grid-template-columns: 80% 20%;
      }
      .profile-menu {
        width: 75%;
        margin-right: 12.5%;
        margin-left: 12.5%;
        display: grid;
        grid-template-columns: auto auto;
        padding-bottom: 6px;
        padding-top: 3px;
      }
      #hist-button {
        background-color: aqua;
      }
      #arch-button {
        background-color: white;
      }
      #story-button {
        background-color: white;
      }
      .profile-button {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        z-index: 5;
        background-color: white;
        border: 1px solid black;
        margin-left: 3px;
        margin-right: 3px;
      }
      #images {
        position: absolute;
        bottom: 8vh;
        height: 92vh;
        width: 100%;
        display: none;
        grid-template-columns: auto;
        grid-template-rows: 76vh 14vh;
        z-index: 4;
      }
      #image-box {
        width: 100%;
        max-height: 76vh;
        padding: 5%;
        justify-content: center;
        align-items: center;
      }
      #image-menu {
        width: 100%;
        display: grid;
        grid-template-columns: 30% 20% 30%;
        padding: 5%;
        gap: 5% 5%;
      }
      .image-button {
        background-color: white;
        border: 1px solid black;
      }
      #pois {
        position: absolute;
        bottom: 8vh;
        height: 30vh;
        width: 88%;
        margin: 3%;
        display: none;
        grid-template-columns: 100%;
        grid-template-rows: 15% auto 25%;
        z-index: 4;
        background-color: white;
        padding: 3%;
        overflow-y: scroll;
        overflow-x: hidden;
        justify-content: left;
        align-items: flex-start;
      }
      #exit-button-box {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
      }
      #exit-survey-button {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
        z-index: 5;
        background-color: white;
        border: 1px solid black;
        margin-left: 3px;
        margin-right: 3px;
      }
      #poi-heading {
        margin: 0px;
        padding: 0px;
      }
      #poi-box {
        margin: 0px;
        padding: 0px;
        font-size: 12px;
      }
      ul {
        list-style-position: inside;
        padding-left: 0;
      }

      /* iOS permission overlay */
      #permission-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        z-index: 999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        color: white;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      }
      #permission-overlay p {
        font-size: 16px;
        margin-bottom: 20px;
      }
      #permission-button {
        padding: 14px 28px;
        font-size: 18px;
        background: aqua;
        color: black;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- iOS orientation permission overlay -->
    <div id="permission-overlay">
      <p>This app needs access to your device's compass for accurate building detection.</p>
      <button id="permission-button" onclick="requestOrientationPermission()">Enable Compass</button>
    </div>

    <script>
      // ─── Parameters ───────────────────────────────────────────────────────────
      const bbox_size = 100;

      const queryString = window.location.search;
      const urlParams = new URLSearchParams(queryString);
      const responseID = urlParams.get('ResponseID');
      const site = urlParams.get('Site');
      const debug = urlParams.get('Debug');

      function openDebugMenu() {
        document.getElementById('debugMenu').style.display =
          (debug === "y") ? "grid" : "none";
      }
      setTimeout(openDebugMenu, 1000);

      // ─── Heading State ────────────────────────────────────────────────────────
      // heading is always set from the magnetometer (compass), not GPS movement.
      // This works reliably while stationary on both iOS and Android.
      let heading = null;
      let headingSource = "none"; // "webkit" | "absolute" | "relative"

      // Circular buffer of recent headings for smoothing
      const HEADING_BUFFER_SIZE = 8;
      let pastHeadings = [];

      /**
       * Circular mean of an array of angles (degrees).
       * Correctly handles wrap-around at 0°/360°.
       */
      function circularMean(angles) {
        if (angles.length === 0) return null;
        const toRad = a => a * Math.PI / 180;
        const toDeg = r => r * 180 / Math.PI;
        const sinSum = angles.reduce((s, a) => s + Math.sin(toRad(a)), 0);
        const cosSum = angles.reduce((s, a) => s + Math.cos(toRad(a)), 0);
        return (toDeg(Math.atan2(sinSum, cosSum)) + 360) % 360;
      }

      /**
       * Circular range: max angular spread in a set of angles.
       * Used to check heading stability.
       */
      function circularRange(angles) {
        if (angles.length < 2) return 0;
        let maxDiff = 0;
        for (let i = 0; i < angles.length; i++) {
          for (let j = i + 1; j < angles.length; j++) {
            const diff = angleDifference(angles[i], angles[j]);
            if (diff > maxDiff) maxDiff = diff;
          }
        }
        return maxDiff;
      }

      /**
       * Smallest signed absolute difference between two angles (degrees).
       */
      function angleDifference(a1, a2) {
        let diff = (a1 - a2) % 360;
        if (diff < -180) diff += 360;
        else if (diff > 180) diff -= 360;
        return Math.abs(diff);
      }

      /**
       * Central handler: receives a raw compass heading in degrees (0–360, CW from N).
       * Smooths via circular mean and updates the global `heading` variable.
       */
      function updateHeading(rawHeading) {
        if (rawHeading === null || rawHeading === undefined || isNaN(rawHeading)) return;

        pastHeadings.push(rawHeading);
        if (pastHeadings.length > HEADING_BUFFER_SIZE) {
          pastHeadings = pastHeadings.slice(pastHeadings.length - HEADING_BUFFER_SIZE);
        }

        heading = circularMean(pastHeadings);

        // Debug output
        const stable = circularRange(pastHeadings) < 15;
        document.getElementById('heading').innerHTML = 'Heading: ' + heading.toFixed(1) + '° [' + headingSource + ']';
        document.getElementById('pastHeadings').innerHTML = 'Buffer: ' + pastHeadings.map(h => Math.round(h)).join(', ');
        document.getElementById('headingStability').innerHTML = stable ? 'Stable' : 'Unstable';
      }

      /**
       * Device orientation handler — the primary source of heading.
       *
       * Priority:
       *   1. event.webkitCompassHeading  (iOS Safari — always absolute, 0=North)
       *   2. event.alpha with absolute=true  (Android Chrome — needs (360 - alpha))
       *   3. event.alpha relative (fallback; less reliable but better than nothing)
       */
      function handleDeviceOrientation(event) {
        if (typeof event.webkitCompassHeading === 'number' &&
            !isNaN(event.webkitCompassHeading)) {
          // iOS: webkitCompassHeading is clockwise from true north
          headingSource = "webkit";
          updateHeading(event.webkitCompassHeading);
        } else if (event.absolute === true && event.alpha !== null) {
          // Android absolute orientation: alpha is CCW from north, so invert
          headingSource = "absolute";
          updateHeading((360 - event.alpha) % 360);
        } else if (event.alpha !== null && event.alpha !== undefined) {
          // Relative fallback — less reliable but still better than GPS heading
          headingSource = "relative";
          updateHeading((360 - event.alpha) % 360);
        }
      }

      /**
       * Request iOS 13+ DeviceOrientation permission and attach listeners.
       * Must be called from a user gesture (button tap) on iOS.
       * On Android / desktop the permission API doesn't exist, so listeners
       * are attached directly.
       */
      async function requestOrientationPermission() {
        document.getElementById('permission-overlay').style.display = 'none';

        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS 13+
          try {
            const permission = await DeviceOrientationEvent.requestPermission();
            if (permission === 'granted') {
              attachOrientationListeners();
            } else {
              console.warn('Device orientation permission denied.');
            }
          } catch (e) {
            console.error('Error requesting orientation permission:', e);
          }
        } else {
          // Android / non-iOS: no permission needed
          attachOrientationListeners();
        }
      }

      function attachOrientationListeners() {
        // Prefer deviceorientationabsolute (guaranteed Earth-frame on Android)
        if ('ondeviceorientationabsolute' in window) {
          window.addEventListener('deviceorientationabsolute', handleDeviceOrientation, true);
        }
        // Also attach standard event as fallback / for iOS webkitCompassHeading
        window.addEventListener('deviceorientation', handleDeviceOrientation, true);
      }

      /**
       * On page load, decide whether to show the iOS permission overlay
       * or go straight to attaching listeners (Android/desktop).
       */
      function initOrientation() {
        if (typeof DeviceOrientationEvent !== 'undefined' &&
            typeof DeviceOrientationEvent.requestPermission === 'function') {
          // iOS 13+ — must prompt user first
          document.getElementById('permission-overlay').style.display = 'flex';
        } else {
          // Android or desktop — attach immediately
          attachOrientationListeners();
        }
      }

      // ─── Button Handlers ──────────────────────────────────────────────────────
      function toggleSelected(selected_id) {
        const ids = ["image-button", "desc-button", "poi-button"];
        for (let x = 0; x < ids.length; x++) {
          if (document.getElementById(ids[x]).style.backgroundColor === "aqua") {
            if (ids[x] !== selected_id) {
              if (ids[x] === "image-button") {
                document.getElementById("image-button").style.backgroundColor = "white";
                document.getElementById("images").style.display = "none";
              } else if (ids[x] === "desc-button") {
                document.getElementById("desc-button").style.backgroundColor = "white";
                document.getElementById("description").style.display = "none";
              } else if (ids[x] === "poi-button") {
                document.getElementById("poi-button").style.backgroundColor = "white";
                document.getElementById("pois").style.display = "none";
              }
            }
          }
        }
        const button = document.getElementById(selected_id);
        if (button.style.backgroundColor !== "aqua") {
          if (selected_id === "desc-button") {
            button.style.backgroundColor = "aqua";
            document.getElementById("description").style.display = "grid";
          } else if (selected_id === "image-button") {
            button.style.backgroundColor = "aqua";
            document.getElementById("images").style.display = "grid";
          } else if (selected_id === "poi-button") {
            button.style.backgroundColor = "aqua";
            document.getElementById("pois").style.display = "grid";
          }
        }
      }

      function proceedToExitSurvey() {
        if (confirm("Are you sure you would like to proceed to the exit survey?")) {
          window.location.href =
            `https://uwaterloo.ca1.qualtrics.com/jfe/form/SV_8wSGsDwBi5ljeh8?ResponseIDEntrance=${responseID}&Site=${site}`;
        }
      }

      function poiText() {
        // POI text population (unchanged from original)
      }

      function toggleImage(id) {
        const images = document.getElementById("image-box").getElementsByTagName("img");
        let selected_image = 0;
        if (Array.from(images).length > 1) {
          for (let x = 0; x < images.length; x++) {
            if (images[x].style.display !== "none") {
              selected_image = images[x].id.split("-")[1];
              break;
            }
          }
          if (selected_image > 0) {
            if (id === "forward" && selected_image < images.length) {
              document.getElementById("image-" + selected_image).style.display = "none";
              document.getElementById("image-" + (parseInt(selected_image) + 1).toString()).style.display = "inline";
            } else if (id === "reverse" && selected_image > 1) {
              document.getElementById("image-" + selected_image).style.display = "none";
              document.getElementById("image-" + (parseInt(selected_image) - 1).toString()).style.display = "inline";
            }
          }
        }
      }

      function resetBuildingProfile(id) {
        const button_id = id.split("-")[0];
        const buttons = ["hist", "arch", "story"];
        for (let x = 0; x < buttons.length; x++) {
          document.getElementById(buttons[x] + "-button").style.backgroundColor =
            buttons[x] === button_id ? "aqua" : "white";
          document.getElementById(buttons[x] + "-description").style.display =
            buttons[x] === button_id ? "inline" : "none";
        }
      }

      // ─── Geofence & Building Loading ──────────────────────────────────────────
      let geofence_buffer = turf.polygon([[[0,0],[0,0.1],[0.1,0.1],[0.1,0],[0,0]]]);
      let gps = turf.point([-1, -1]);
      let objects = [];

      async function getBuildings(bbox) {
        const c = bbox.geometry.coordinates[0];
        const bbox_string = c[0][0] + "," + c[0][1] + "," + c[1][0] + "," + c[2][1];
        const res = await fetch(
          "https://atlas.digitalhistory.ca/api/buildings/?ar=y&bbox=" + bbox_string
        );
        return await res.json();
      }

      function parseBuildings(bbox) {
        getBuildings(bbox).then((buildings) => {
          let scene = document.querySelector("a-scene");
          if (objects.length > 0) {
            for (let y = 0; y < objects.length; y++) {
              const el = document.getElementById(objects[y].id);
              if (el) el.outerHTML = "";
            }
            objects = [];
          }
          for (let x = 0; x < buildings.features.length; x++) {
            const building_id = buildings.features[x].properties.id;
            const entity = document.createElement("a-entity");
            const point = turf.toWgs84(turf.point(buildings.features[x].geometry.coordinates));
            entity.setAttribute("gps-new-entity-place", {
              latitude: point.geometry.coordinates[1],
              longitude: point.geometry.coordinates[0],
            });
            objects.push({ id: building_id });
            entity.setAttribute("id", building_id);
            const sphere = document.createElement("a-sphere");
            sphere.setAttribute("radius", 2);
            sphere.setAttribute("color", "white");
            entity.appendChild(sphere);
            const text = document.createElement("a-text");
            text.setAttribute("color", "white");
            text.setAttribute("look-at", "[gps-new-camera]");
            text.setAttribute("scale", { x: 4, y: 4, z: 4 });
            text.setAttribute("position", { x: 0, y: 5, z: -0.5 });
            text.setAttribute("value", "");
            text.setAttribute("align", "center");
            entity.appendChild(text);
            scene.appendChild(entity);
          }
        }).catch(err => console.log(err));
      }

      function createGeofence() {
        const edge_update_distance = bbox_size * 0.8;
        console.log("Updating geofence...");
        const geo_buffer = turf.toMercator(
          turf.bboxPolygon(turf.bbox(turf.buffer(gps, bbox_size - edge_update_distance, { units: "meters" })))
        );
        const building_bbox = turf.toMercator(
          turf.bboxPolygon(turf.bbox(turf.buffer(gps, bbox_size, { units: "meters" })))
        );
        parseBuildings(building_bbox);
        return geo_buffer;
      }

      function checkGeofence(position) {
        console.log("Checking geofence...");
        if (position.coords.latitude && position.coords.longitude) {
          gps = turf.point([position.coords.longitude, position.coords.latitude]);
          const in_geofence = turf.booleanPointInPolygon(gps, turf.toWgs84(geofence_buffer));
          if (!in_geofence) {
            geofence_buffer = createGeofence();
          }
        }
      }

      function geofenceUpdate() {
        if ("geolocation" in navigator) {
          navigator.geolocation.getCurrentPosition(checkGeofence);
        } else {
          clearInterval(geofenceChecker);
          console.log("GPS is not enabled or configured properly on your device.");
        }
      }

      const geofenceChecker = setInterval(() => { geofenceUpdate(); }, 3 * 1000);

      async function fetchBuildingInfo(id) {
        const res = await fetch(`https://atlas.digitalhistory.ca/api/building/${id}/`);
        return await res.json();
      }

      // ─── Main Init ────────────────────────────────────────────────────────────
      window.onload = setTimeout(() => {
        geofenceUpdate();
        poiText();
        initOrientation();

        const camera = document.querySelector("[gps-new-camera]");

        camera.addEventListener("gps-camera-update-position", () => {

          /**
           * Calculate compass bearing from the A-Frame camera to a target entity.
           *
           * Fix: A-Frame's coordinate system has -Z pointing forward (north),
           * so the correct atan2 argument order is (deltaX, -deltaZ),
           * NOT (deltaZ, deltaX) as in the original code.
           */
          function calculateBearing(cameraPosition, targetPosition) {
            const deltaX = targetPosition.x - cameraPosition.x;
            const deltaZ = targetPosition.z - cameraPosition.z;
            // atan2(deltaX, -deltaZ) maps A-Frame world space to compass bearing
            const bearing = Math.atan2(deltaX, -deltaZ) * (180 / Math.PI);
            return (bearing + 360) % 360;
          }

          let distance = 9999;
          let minDistance = 100;
          let id = 0;

          // Start with a 60° cone; widen to 120° if nothing found in cone.
          // This gracefully handles momentary compass noise without
          // falling all the way back to direction-blind distance selection.
          const ANGLE_NARROW = 60;
          const ANGLE_WIDE   = 120;

          let selectedBearing = null;
          let selectedDiff    = null;

          const building_markers = document.getElementsByTagName("a-entity");
          const markersArray = Array.from(building_markers);

          if (heading !== null) {
            document.getElementById('heading-enabled').innerHTML = "Heading enabled [" + headingSource + "]";

            // Pass 1: narrow 60° cone
            for (let x = 0; x < markersArray.length; x++) {
              distance = camera.object3D.position.distanceTo(markersArray[x].object3D.position);
              const bearing = calculateBearing(camera.object3D.position, markersArray[x].object3D.position);
              const diff = angleDifference(heading, bearing);

              if (distance < minDistance && diff < ANGLE_NARROW) {
                minDistance = distance;
                id = parseInt(markersArray[x].id);
                selectedBearing = Math.round(bearing);
                selectedDiff    = Math.round(diff);
              }
            }

            // Pass 2: widen to 120° if nothing found in the narrow cone
            if (id === 0) {
              minDistance = 100;
              for (let x = 0; x < markersArray.length; x++) {
                distance = camera.object3D.position.distanceTo(markersArray[x].object3D.position);
                const bearing = calculateBearing(camera.object3D.position, markersArray[x].object3D.position);
                const diff = angleDifference(heading, bearing);

                if (distance < minDistance && diff < ANGLE_WIDE) {
                  minDistance = distance;
                  id = parseInt(markersArray[x].id);
                  selectedBearing = Math.round(bearing);
                  selectedDiff    = Math.round(diff);
                }
              }
            }

          } else {
            // No heading available yet — fall back to pure distance
            document.getElementById('heading-enabled').innerHTML = "Heading unavailable — using distance only";
            for (let x = 0; x < markersArray.length; x++) {
              distance = camera.object3D.position.distanceTo(markersArray[x].object3D.position);
              if (distance < minDistance) {
                minDistance = distance;
                id = parseInt(markersArray[x].id);
              }
            }
          }

          if (selectedBearing !== null) {
            document.getElementById('bearing').innerHTML = 'Bearing: ' + selectedBearing;
            document.getElementById('diff').innerHTML    = 'Diff: ' + selectedDiff;
          }

          const highlight_color = "aqua";

          if (id > 0) {
            if (
              document.getElementById(id)
                .getElementsByTagName("a-sphere")[0]
                .getAttribute("color") !== highlight_color
            ) {
              // Deselect previously highlighted building
              const highlighted = document.querySelectorAll(`a-sphere[color=${highlight_color}]`);
              if (highlighted.length === 1) {
                highlighted[0].setAttribute("color", "white");
                highlighted[0].parentElement.getElementsByTagName("a-text")[0].style.visibility = "hidden";
              }
              // Highlight new building
              document.getElementById(id).getElementsByTagName("a-sphere")[0].setAttribute("color", highlight_color);
              document.getElementById(id).getElementsByTagName("a-text")[0].style.visibility = "visible";

              fetchBuildingInfo(id).then((building) => {
                document.getElementById(id).getElementsByTagName("a-text")[0].setAttribute(
                  "value",
                  (building.name ? "Name: " + building.name : "") +
                  (building.date_of_construction
                    ? "\nBuilt: " + building.date_of_construction.toString().substring(0, 4)
                    : "") +
                  (building.building_category
                    ? "\nType: " + building.building_category.name
                    : "") +
                  (building.architectural_style
                    ? "\nStyle: " + building.architectural_style.name
                    : "")
                );
                document.getElementById("hist-description-text").innerHTML = building.historical_description;
                document.getElementById("building-name").innerHTML = building.name;
                document.getElementById("arch-description-text").innerHTML = building.architectural_description;

                let image_box = document.getElementById("image-box");
                image_box.innerHTML = "";
                let children = 0;
                for (let y = 0; y < building.items.length; y++) {
                  if (building.items[y].type === "photograph" || building.items[y].type === "postcard") {
                    children = image_box.getElementsByTagName("img").length;
                    const img = document.createElement("img");
                    img.setAttribute("src", building.items[y].files[0].image);
                    img.setAttribute("id", "image-" + (y + 1));
                    img.style.maxWidth = "90vw";
                    img.style.opacity = 0.7;
                    img.style.zIndex = 4;
                    img.style.marginTop = "25vh";
                    img.style.marginBottom = "25vh";
                    img.style.display = children > 0 ? "none" : "inline";
                    image_box.appendChild(img);
                  }
                }
              });
            }
          } else {
            const noBuilding = "No nearby buildings in front of your device. Try rotating your device.";
            document.getElementById("hist-description-text").innerHTML = noBuilding;
            document.getElementById("building-name").innerHTML = "No nearby buildings in view.";
            document.getElementById("arch-description-text").innerHTML = noBuilding;
            const highlighted = document.querySelectorAll(`a-sphere[color=${highlight_color}]`);
            if (highlighted.length > 0) {
              highlighted[0].setAttribute("color", "white");
            }
          }
        });

      }, 2000);
    </script>

    <div>
      <a-scene
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: true"
        renderer="antialias: true; alpha: true"
      >
        <a-camera
          look-controls-enabled="false"
          arjs-device-orientation-controls="smoothingFactor: 0.1"
          gps-new-camera="gpsMinDistance: 3; maxDistance: 100; positionMinAccuracy: 25; alert: true"
        ></a-camera>
      </a-scene>

      <div id="debugMenu">
        <span id="event-last-fired" style="display: inherit;"></span>
        <span id="heading-enabled" style="display: inherit;"></span>
        <span id="heading" style="display: inherit;"></span>
        <span id="pastHeadings" style="display: inherit;"></span>
        <span id="headingStability" style="display: inherit;"></span>
        <span id="bearing" style="display: inherit;"></span>
        <span id="diff" style="display: inherit;"></span>
      </div>

      <div class="thumbMenu">
        <button class="thumbButton" id="desc-button" onclick="toggleSelected(this.id)">Description</button>
        <button class="thumbButton" id="image-button" onclick="toggleSelected(this.id)">Images</button>
        <button class="thumbButton" id="poi-button" onclick="toggleSelected(this.id)">Exit Survey</button>
      </div>

      <div id="description">
        <h3 id="building-name">Loading nearby buildings...</h3>
        <div class="description-box">
          <div id="hist-description">
            <div class="description-box">
              <div class="audio-grid">
                <p id="hist-description-text"></p>
                <div></div>
              </div>
            </div>
          </div>
          <div id="arch-description">
            <div class="audio-grid">
              <p id="arch-description-text"></p>
              <div></div>
            </div>
          </div>
        </div>
        <div class="profile-menu">
          <button class="profile-button" id="hist-button" onclick="resetBuildingProfile(this.id)">History</button>
          <button class="profile-button" id="arch-button" onclick="resetBuildingProfile(this.id)">Architecture</button>
        </div>
      </div>
    </div>

    <div id="images">
      <div id="image-box"></div>
      <div id="image-menu">
        <button id="reverse" class="image-button" onclick="toggleImage(this.id)">Back</button>
        <button id="close" class="image-button" onclick="toggleSelected(this.id)">Close</button>
        <button id="forward" class="image-button" onclick="toggleImage(this.id)">Forward</button>
      </div>
    </div>

    <div id="pois">
      <h3 id="poi-heading">Exit Survey</h3>
      <div id="exit-button-box">
        <button id="exit-survey-button" onclick="proceedToExitSurvey()">Proceed to Exit Survey</button>
      </div>
    </div>

  </body>
</html>
